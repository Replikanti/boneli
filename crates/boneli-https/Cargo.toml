[package]
name = "boneli-https"
description = "Boneli support crate: a TLS client on rustls with the ring provider, hybrid post-quantum key exchange, certificate revocation by CRL and OCSP, of the leaf and its intermediates, and name resolution under each request's deadline, for boneli-http, the Dial seam of HTTPS clients, ring's SHA-256, RS256 signatures and random source, and signature verification and code-signing chains for image signatures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The HTTP/1.1 layer that runs over the TLS stream; a support crate, so the
# edge stays inside the generic plumbing (docs/ARCHITECTURE.md).
boneli-http.workspace = true
# TLS 1.3 and 1.2 in Rust, the stack docs/ARCHITECTURE.md approves for
# boneli-https and ADR-005 records with its transitive crates.
# - `ring`: the crypto provider. Not `aws_lc_rs`, because `aws-lc-sys` is
#   banned in deny.toml (a CMake C build).
# - `std`: blocking `Read`/`Write` streams over std sockets.
# - `tls12`: self-hosted forges and registries in customer networks may not
#   speak TLS 1.3. It adds no crate.
# - No `logging`: it would pull `log`; Boneli writes its own structured logs.
# `ring` also provides the runner's content hash, SHA-256 through
# `rustls::crypto::hash` (`Sha256`, ADR-009), and RS256 signatures and
# random bytes through the provider's `key_provider` and `secure_random`
# (`RsaSha256Key`, `fill_random`, ADR-014); none of them needs a feature.
# Nor does revocation by CRL (ADR-017): `WebPkiServerVerifier` with CRLs
# is part of the `ring` and `std` features above.
# Signature verification for image signatures (`PublicKey`, ADR-029)
# uses the webpki algorithms of the same provider; no feature either.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Mozilla's root certificates, compiled in, so trust does not depend on the
# host's CA bundle (ADR-005).
webpki-roots = "1.0.12"
# ML-KEM-768 (FIPS 203), the post-quantum half of the hybrid key exchange
# X25519MLKEM768 (RFC 10024, ADR-016); the X25519 half is ring's, through
# rustls. Pure Rust; ADR-016 records its audit status and its 17 crates.
# - `zeroize`: wipes the decapsulation key on drop; it adds no crate.
# - No `alloc`: it would list five unused PKCS#8 crates in the metadata
#   the architecture check reads.
# - No `getrandom`: it would pull a second getrandom with its own libc
#   edge; the seed comes from `fill_random`, ring's source.
# At least 0.3.4, the release with the hardened reduction and the
# `ctutils` and `cmov` versions past their advisories (ADR-016, item 3).
ml-kem = { version = "0.3.4", default-features = false, features = ["zeroize"] }
# Wipes the key generation seed and the ML-KEM shared secret (ADR-016).
# Already in the graph through rustls; a direct edge, no new crate.
zeroize = { version = "1.9.1", default-features = false }
# The verified path of a server's chain, for the leaf's issuer, and the
# check of a delegated OCSP responder's certificate (`verify_for_usage`
# with `id-kp-OCSPSigning`); ADR-020. The same path gives the issuers of
# the intermediates, whose CRLs ADR-027 checks. The code-signing chains of
# image signatures (`verify_code_signing`, `id-kp-codeSigning`, ADR-029)
# go through `verify_for_usage` too. Already in the graph through rustls;
# a direct edge, no new crate. `alloc` for `VerifiedPath::issuer_spki`.
rustls-webpki = { version = "0.103.17", default-features = false, features = ["alloc"] }
# SHA-1 for OCSP CertIDs only (`digest::SHA1_FOR_LEGACY_USE_ONLY`): every
# measured responder answers with a SHA-1 CertID (ADR-020). Already in the
# graph as rustls' provider; a direct edge, no new crate.
ring = { version = "0.17.14", default-features = false }
