[package]
name = "boneli-git-cli"
description = "Boneli adapter: the Git port over the git binary, with the workspace format the sandbox exchanges (ADR-010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Adapter crate: the domain and the application only (ADR-010). No
# external edge; git is a process, not a dependency.
[dependencies]
# `CitationProblem`, the reason the path rule gives when a workspace path
# is refused, and `CommitSha`, the base `fetch_base` takes.
boneli-domain.workspace = true
# `RelativePath` and its repository-metadata rule (ADR-010, D1), and the
# `Git` port `GitCli` implements; its tests run the port's contract suite.
boneli-app.workspace = true
