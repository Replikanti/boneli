[package]
name = "boneli-git-cli"
description = "Boneli adapter: the Git port over the git binary, reading and writing the workspace format of boneli-workspace (ADR-010, ADR-042)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Adapter crate: the domain, the application and two support crates
# (ADR-010, ADR-024, ADR-042). No external edge; git is a process, not a
# dependency.
[dependencies]
# `CitationProblem`, the reason the path rule gives when a workspace path
# is refused, and `CommitSha`, the base `fetch_base` takes.
boneli-domain.workspace = true
# `RelativePath` and its repository-metadata rule (ADR-010, D1), and the
# `Git` port `GitCli` implements; its tests run the port's contract suite.
boneli-app.workspace = true
# The root rules of ADR-024: the adapter's root is created under a
# resolved parent whose ancestors no one else can rename. A support crate,
# no external edge.
boneli-private-dir.workspace = true
# The workspace format and its writer (ADR-010, D2 and D3), which the
# sandbox adapter shares, under the tree path rule this crate passes in
# (ADR-042, D1). A support crate, no external edge.
boneli-workspace.workspace = true

[dev-dependencies]
# The same crate with its test seam, `Workspace::insert`, which the unit
# tests of `patch_between` build small workspaces with. Dev-only, so normal
# builds never see the feature (resolver 3).
boneli-workspace = { workspace = true, features = ["test-seam"] }
