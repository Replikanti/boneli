[package]
name = "boneli-sys"
description = "Boneli support crate: the sandbox runtime's syscalls, the only crate with unsafe code (ADR-007)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The workspace lints without `unsafe_code = "forbid"`, plus the lints that
# keep unsafe code reviewable. tools/check-architecture.sh (rule `sys-lints`)
# checks that this table keeps every workspace lint at the same or a
# stricter level and the three unsafe lints of `[check] unsafe-lints` in
# tools/architecture.toml at deny or forbid (ADR-007, D6).
[lints.rust]
missing_docs = "warn"
# Every unsafe operation sits in its own `unsafe` block, also inside an
# `unsafe fn`, so each one carries its own `// SAFETY:` comment.
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
# A panic in the cloned child aborts it mid-setup with no report.
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
# Syscall numbers, structs and constants for namespaces, mounts, seccomp
# and Landlock: listed in docs/ARCHITECTURE.md ("Pure Rust and
# dependencies") and recorded as `libc <- boneli-sys` in
# tools/architecture.toml (decision ADR-001, the strict libc edge). Its
# build script is approved by ADR-005. No other dependency (ADR-007).
libc = "0.2.191"
