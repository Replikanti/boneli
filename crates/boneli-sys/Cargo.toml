[package]
name = "boneli-sys"
description = "Boneli support crate: the sandbox runtime's syscalls, the only crate with unsafe code (ADR-007)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The workspace lints without `unsafe_code = "forbid"`, plus the lints that
# keep unsafe code reviewable. tools/check-architecture.sh (rule `sys-lints`)
# checks that this table keeps every workspace lint at the same or a
# stricter level and the lints of `[check] unsafe-lints` in
# tools/architecture.toml at forbid, which an inner `#![allow]` cannot
# lower (ADR-007, D6).
[lints.rust]
missing_docs = "warn"
# Every unsafe operation sits in its own `unsafe` block, also inside an
# `unsafe fn`, so each one carries its own `// SAFETY:` comment.
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
# A panic in the cloned child aborts it mid-setup with no report.
unwrap_used = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"

[dependencies]
# Syscall numbers, structs and constants for namespaces, mounts, seccomp
# and Landlock: listed in docs/ARCHITECTURE.md ("Pure Rust and
# dependencies") and recorded as `libc <- boneli-sys` in
# tools/architecture.toml (decision ADR-001, the strict libc edge). Its
# build script is approved by ADR-005. No other dependency (ADR-007).
libc = "0.2.191"

[dev-dependencies]
# Reads Docker's vendored seccomp profile for the comparison in ADR-007 D2
# (tests/boneli_sys_tests/census/docker.rs): a std-only member crate
# (ADR-008), test-only, so `[dependencies]` keeps libc alone.
boneli-json.workspace = true

[features]
# `Cgroup::fail_stats_keeper`, which makes a sandbox's statistics keeper
# fail as a read would, for the adapter's tests of its fail-closed outcome
# (ADR-042, D5 and D8). Only `[dev-dependencies]` enable it; resolver 3
# keeps dev-dependency features out of normal builds, as for
# `boneli-private-dir` (ADR-030, D4).
test-seam = []

# Its own `main`: only the main thread can end itself with
# `exit_main_thread`, and libtest runs every test on a spawned thread
# (#35, ADR-015 D10).
[[test]]
name = "exit_main_thread"
harness = false
