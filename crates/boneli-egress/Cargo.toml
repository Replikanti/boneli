[package]
name = "boneli-egress"
description = "Boneli egress proxy: CONNECT to an exact per-run allowlist of global addresses, with a write-ahead connection log (ADR-006)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Composition root: may depend on any member that is not a root (ADR-001).
[dependencies]
# CONNECT parsing and the authority grammar; a support crate. Allowlist
# entries go through the same parser as CONNECT targets (ADR-006, D2).
boneli-http.workspace = true
# The `Clock` port, which `MonotonicClock` implements for the log's `t`
# (ADR-006, D11).
boneli-app.workspace = true

[dev-dependencies]
# `StepClock`, a deterministic `Clock` for the proxy tests.
boneli-memory.workspace = true
