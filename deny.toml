# cargo-deny policy, run by the `audit` CI job.
# Widening the license list, adding an exception or a new source is a
# conscious decision: record the reason next to the entry, in the PR that
# needs it. Which crate may pull which external crate, transitive edges
# included, is limited by tools/architecture.toml (ADR-001). There is no
# [bans] allow list here: it is a set of names that cannot say which parent
# may pull a crate and lets a vendored path crate pass by name (ADR-001,
# "Alternatives considered").

[graph]
# Dev-dependencies are checked too: their build scripts and proc macros run
# in CI and on every developer machine, so they are supply chain as well.
exclude-dev = false
# The `check` job builds with --all-features; check the same graph here, so a
# crate behind a feature cannot slip past the bans.
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
]
# Per-crate exceptions, each with the dependency path that pulls it in.
# The TLS stack of boneli-https (ADR-005). Exceptions are by crate name, not
# version: a license that changes in an update still fails unless it is
# listed here. ISC, BSD-3-Clause and CDLA-Permissive-2.0 are permissive and
# compatible with Apache-2.0; binary releases ship their notices (#22).
exceptions = [
    # boneli-https -> rustls -> ring: Apache-2.0 AND ISC (BoringSSL code).
    { crate = "ring", allow = ["ISC"] },
    # boneli-https -> rustls -> ring -> untrusted, and via rustls-webpki.
    { crate = "untrusted", allow = ["ISC"] },
    # boneli-https -> rustls -> rustls-webpki.
    { crate = "rustls-webpki", allow = ["ISC"] },
    # boneli-https -> rustls -> subtle.
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    # boneli-https -> webpki-roots: Mozilla's root list as data.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version. They are
# private (publish = false), so path wildcards are fine.
allow-wildcard-paths = true
# What docs/ARCHITECTURE.md says we write ourselves instead.
deny = [
    { crate = "tokio", reason = "no async runtime in the runner: ports are synchronous, std threads" },
    { crate = "async-std", reason = "no async runtime in the runner" },
    { crate = "serde", reason = "own JSON without derive; mapping to DTOs lives in adapters" },
    { crate = "serde_json", reason = "own JSON without derive" },
    { crate = "clap", reason = "own argument parsing" },
    { crate = "tracing", reason = "own structured logging" },
    { crate = "anyhow", reason = "own error types" },
    { crate = "thiserror", reason = "own error types" },
    { crate = "rusqlite", reason = "bundles C SQLite; append-only log and content-addressed store instead" },
    { crate = "hyper", reason = "own HTTP/1.1 on httparse" },
    { crate = "reqwest", reason = "own HTTP/1.1 client over rustls" },
    { crate = "openssl-sys", reason = "C TLS; rustls with ring only" },
    { crate = "aws-lc-sys", reason = "C crypto build; ring provider only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
