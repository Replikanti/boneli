# Architecture and dependency policy, read by tools/check_architecture.py.
# Why each part exists: docs/adr/001-core-purity-and-dependency-allowlist.md.
#
# Format: only [table] headers, bare keys, basic strings and arrays of
# strings, so that the workspace's own TOML subset parser can read it later.
#
# Changing this file is a design change and gets the same review as the
# checker:
#   - a new external crate name needs an ADR or a row in the table of
#     docs/ARCHITECTURE.md ("Pure Rust and dependencies");
#   - a new edge between crates already listed needs its own record with a
#     reason and the decision that approved the parent's stack;
#   - every edge into a strict crate (`strict = "ADR-NNN"`) cites its own
#     accepted ADR, and that ADR names the edge as `<parent> -> <crate>`.

[roles]
# Pure core: #![no_std] with alloc, no dependencies, token scan.
core = ["boneli-domain", "boneli-app"]
# Generic plumbing without domain knowledge.
support = ["boneli-sys", "boneli-http", "boneli-https", "boneli-json", "boneli-toml"]
# Composition roots: wire adapters, nothing depends on them.
roots = ["boneli-runner", "boneli-gw", "boneli-egress", "boneli-shim", "boneli-cli"]
# The only crates that may contain `unsafe`.
unsafe = ["boneli-sys"]
# The only crates that may have a build script (and with it a `links` key,
# which cargo allows only with a build script): a build script can compile
# and link native code that no scan sees. Empty today; adding a crate needs
# an ADR that names it, and core crates cannot be listed (ADR-001).
build-script = ["boneli-domain"]

[check]
# The runner is Linux-only. Both architectures it ships for, with glibc and
# with musl (static binaries such as the shim may ship on musl). Dependency
# targets are evaluated against these; flag-dependent cfgs count as true.
platforms = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# A target without std: the core crates must build for it.
no-std-target = "x86_64-unknown-none"

[external.libc]
reason = "syscall declarations (namespaces, mount, seccomp, Landlock)"
decision = "ARCHITECTURE"
# The only approved crate with raw syscall access: every edge into it is a
# new path to the kernel and needs its own accepted ADR that names it.
strict = "ADR-001"

[external.libc.pulled-by.boneli-sys]
reason = "boneli-sys is the one place for syscalls and unsafe code"
decision = "ADR-001"

[external.httparse]
reason = "HTTP/1.x parsing without further dependencies"
decision = "ARCHITECTURE"

[external.httparse.pulled-by.boneli-http]
reason = "the own HTTP/1.1 server and client parse with it"
decision = "ARCHITECTURE"

[external.rustls]
reason = "TLS to LLM providers, forges and registries"
decision = "ARCHITECTURE"

[external.rustls.pulled-by.boneli-https]
reason = "boneli-https is the only place for TLS"
decision = "ARCHITECTURE"

[external.webpki-roots]
reason = "root certificates for rustls"
decision = "ARCHITECTURE"

[external.webpki-roots.pulled-by.boneli-https]
reason = "boneli-https is the only place for TLS"
decision = "ARCHITECTURE"

[external.ring]
reason = "cryptographic provider for rustls"
decision = "ARCHITECTURE"

[external.ring.pulled-by.boneli-https]
reason = "boneli-https is the only place for TLS"
decision = "ARCHITECTURE"

[external.sha2]
reason = "content addressing and evidence"
decision = "ARCHITECTURE"

[external.sha2.pulled-by.boneli-store-fs]
reason = "the content-addressed store hashes blobs"
decision = "ARCHITECTURE"

[external.miniz_oxide]
reason = "unpacking gzip OCI image layers"
decision = "ARCHITECTURE"

[external.miniz_oxide.pulled-by.boneli-oci]
reason = "the OCI image store unpacks layers"
decision = "ARCHITECTURE"

[external.ruzstd]
reason = "unpacking zstd OCI image layers"
decision = "ARCHITECTURE"

[external.ruzstd.pulled-by.boneli-oci]
reason = "the OCI image store unpacks layers"
decision = "ARCHITECTURE"
