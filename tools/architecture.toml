# ---- Post-quantum key exchange of boneli-https (ADR-016) -------------------
# ml-kem without default features, with `zeroize`, as resolved for #37:
# ML-KEM-768 for the hybrid X25519MLKEM768 (RFC 10024). The crates and the
# edges between them; ADR-016 lists every crate with its version, license,
# MSRV and role, and names the one edge into libc literally. cfg-if, libc
# and zeroize are ADR-005 crates; only their new edges are recorded here.

[external.ml-kem]
reason = "ML-KEM-768 (FIPS 203), the post-quantum half of the TLS key exchange"
