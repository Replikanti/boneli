# Architecture and dependency policy, read by the architecture checker
# (crates/boneli-arch-check, run by tools/check-architecture.sh).
# Why each part exists: docs/adr/001-core-purity-and-dependency-allowlist.md.
#
# Format: only [table] headers, bare keys, basic strings and arrays of
# strings, so that the workspace's own TOML subset parser can read it later.
#
# Changing this file is a design change and gets the same review as the
# checker:
#   - a new external crate name needs an ADR or a row in the table of
#     docs/ARCHITECTURE.md ("Pure Rust and dependencies");
#   - a new edge between crates already listed needs its own record with a
#     reason and the decision that approved the parent's stack;
#   - every edge into a strict crate (`strict = "ADR-NNN"`) cites its own
#     accepted ADR, and that ADR names the edge as `<parent> -> <crate>`;
#   - every reachable external crate with a build script carries
#     `build-script = "ADR-NNN"`, an accepted ADR that approves that script
#     as `<crate>'s build script is approved` (ADR-005). The approval is
#     per crate, not per version.

[roles]
# Pure core: #![no_std] with alloc, no dependencies, token scan.
core = ["boneli-domain", "boneli-app"]
# Generic plumbing without domain knowledge.
# boneli-private-dir holds the store-root rules that file-backed adapters
# share (ADR-021): an adapter cannot depend on another adapter.
# boneli-sigstore verifies Sigstore signatures for every adapter that pulls
# signed artifacts (ADR-029, S3), on boneli-https and boneli-json only.
# boneli-tuf keeps the operator's trusted_root.json current from Sigstore's
# TUF repository (ADR-033), on boneli-https, boneli-json and
# boneli-sigstore; no external crate.
support = ["boneli-sys", "boneli-http", "boneli-https", "boneli-json", "boneli-toml", "boneli-private-dir", "boneli-sigstore", "boneli-tuf"]
# Composition roots: wire adapters, nothing depends on them.
# boneli-replay-check is the test-only root of ADR-002: the two-process
# replay gate for address leaks. As a root it is a leaf, so no production
# crate can depend on it, and it may later depend on the in-memory adapters
# that the application replay (#3) needs.
# boneli-acceptance is the test-only root of ADR-014 D12: live acceptance
# tests that wire real adapters (boneli-git-cli and boneli-forge-github)
# against real services. It declares those adapters as regular
# dependencies, so this check holds it to the root rules, and as a leaf no
# crate can depend on it.
# boneli-arch-check is the tool root of ADR-015: the architecture checker
# itself, a binary that tools/check-architecture.sh builds and runs. As a
# member it is held to every rule it enforces, and as a leaf no crate can
# depend on it.
roots = ["boneli-runner", "boneli-gw", "boneli-egress", "boneli-shim", "boneli-cli", "boneli-replay-check", "boneli-acceptance", "boneli-arch-check"]
# The only crates that may contain `unsafe`.
unsafe = ["boneli-sys"]
# The only crates that may have a build script (and with it a `links` key,
# which cargo allows only with a build script): a build script can compile
# and link native code that no scan sees. Empty today; adding a crate needs
# an ADR that names it, and core crates cannot be listed (ADR-001).
build-script = []

[check]
# The runner is Linux-only. Both architectures it ships for, with glibc and
# with musl (static binaries such as the shim may ship on musl). Dependency
# targets are evaluated against these; flag-dependent cfgs count as true.
platforms = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# A target without std: the core crates must build for it.
no-std-target = "x86_64-unknown-none"
# Lints the unsafe crates (roles.unsafe) set to forbid in their own [lints]
# table, next to every workspace lint except unsafe_code (rule sys-lints,
# ADR-007 D6): each unsafe operation in its own block, also in an unsafe
# fn, each block with a `// SAFETY:` comment, and no unwrap (a panic in the
# cloned child aborts it mid-setup). forbid, because an inner #![allow]
# in the source overrides deny.
unsafe-lints = ["rust.unsafe_op_in_unsafe_fn", "clippy.undocumented_unsafe_blocks", "clippy.multiple_unsafe_ops_per_block", "clippy.unwrap_used"]
# The one file that may take file locks (rule file-lock, ADR-030 D5): the
# shared lock type, which holds the release rule of ADR-030 D1. Everywhere
# else a raw lock name or a lock method call that is not a proven Mutex or
# stdio form fails. Without this key no file is exempt.
file-lock = "crates/boneli-private-dir/src/lock.rs"

[external.libc]
reason = "syscall declarations (namespaces, mount, seccomp, Landlock)"
decision = "ARCHITECTURE"
# The only approved crate with raw syscall access: every edge into it is a
# new path to the kernel and needs its own accepted ADR that names it.
strict = "ADR-001"
# Probes the rustc version and prints cfgs.
build-script = "ADR-005"

[external.libc.pulled-by.boneli-sys]
reason = "boneli-sys is the one place for syscalls and unsafe code"
decision = "ADR-001"

[external.httparse]
reason = "HTTP/1.x parsing without further dependencies"
decision = "ARCHITECTURE"
