name: hub-redirect-measure

# Temporary (#117, removed before merge): which hosts Docker Hub redirects
# anonymous blob requests to, as seen from GitHub-hosted runners. For the
# `latest` index of 22 repositories, the linux/amd64 and linux/arm64
# manifests, every config and layer blob is requested at
# registry-1.docker.io without following the redirect; the first-hop host
# is counted per round. 3 rounds, 10 minutes apart. 22 index and at most
# 44 manifest GETs per job, under the anonymous limit of 100 per hour;
# blob requests do not count against it. No blob is downloaded: the first
# request to each new host is followed once with `Range: bytes=0-0` to see
# whether it answers or redirects again.
on:
  pull_request:
    paths:
      - .github/workflows/hub-redirect-measure.yml

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Measure blob redirect hosts
        shell: sh -eu {0}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          repos="library/nginx library/memcached library/busybox library/postgres library/alpine library/redis library/ubuntu library/python library/node library/mysql library/mongo library/httpd library/rabbitmq library/traefik library/hello-world library/mariadb library/golang library/debian library/ruby library/php chainguard/node grafana/grafana"
          api=https://registry-1.docker.io
          accept_index='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          accept_manifest='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          work="$RUNNER_TEMP/measure"
          mkdir -p "$work"
          token() {
            curl -sf "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$1:pull" | jq -r .token
          }
          # Blob list: one line "<repo> <digest>" per distinct blob.
          : > "$work/blobs"
          manifests=0
          for repo in $repos; do
            tok=$(token "$repo")
            curl -sf -H "Authorization: Bearer $tok" -H "Accept: $accept_index" \
              "$api/v2/$repo/manifests/latest" > "$work/index.json"
            manifests=$((manifests + 1))
            for d in $(jq -r '.manifests[]? | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest' "$work/index.json"); do
              curl -sf -H "Authorization: Bearer $tok" -H "Accept: $accept_manifest" \
                "$api/v2/$repo/manifests/$d" > "$work/manifest.json"
              manifests=$((manifests + 1))
              jq -r --arg r "$repo" '(.config.digest, .layers[].digest) | "\($r) \(.)"' "$work/manifest.json" >> "$work/blobs"
            done
          done
          sort -u "$work/blobs" > "$work/blobs.u"
          echo "manifest GETs: $manifests, distinct blobs: $(wc -l < "$work/blobs.u")"
          : > "$work/seen-hosts"
          for round in 1 2 3; do
            if [ "$round" -gt 1 ]; then sleep 600; fi
            : > "$work/round"
            prev=""
            while read -r repo digest; do
              if [ "$repo" != "$prev" ]; then tok=$(token "$repo"); prev=$repo; fi
              out=$(curl -s -o /dev/null -H "Authorization: Bearer $tok" \
                -w '%{http_code} %{redirect_url}' "$api/v2/$repo/blobs/$digest" || echo "curl-error")
              code=${out%% *}
              loc=${out#* }
              host=$(printf '%s\n' "$loc" | sed -n 's#^https\{0,1\}://\([^/:?]*\).*#\1#p')
              [ -n "$host" ] || host="(none)"
              echo "$code $host" >> "$work/round"
              if [ "$host" != "(none)" ] && ! grep -qxF "$host" "$work/seen-hosts"; then
                echo "$host" >> "$work/seen-hosts"
                follow=$(curl -s -o /dev/null -r 0-0 -w '%{http_code} %{redirect_url}' "$loc" || echo "curl-error")
                next=$(printf '%s\n' "${follow#* }" | sed -n 's#^https\{0,1\}://\([^/:?]*\).*#\1#p')
                echo "first hit of $host ($repo $digest): range follow ${follow%% *}, further redirect host: ${next:-none}"
              fi
            done < "$work/blobs.u"
            echo "round $round ($(date -u +%H:%M) UTC), arch $ARCH: status host count"
            sort "$work/round" | uniq -c | awk '{ print "  " $2 " " $3 " " $1 }' | tee -a "$GITHUB_STEP_SUMMARY"
          done
