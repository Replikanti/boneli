name: CI

on:
  push:
    branches: [main]
  # Every pull request, deliberately without path filters: `check` and `audit`
  # are required status checks, and a filtered-out PR would leave them pending
  # forever. `edited` re-runs the issue-link gate when only the PR body changes.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The toolchain this workflow installs outranks any rust-toolchain file
      # in the checkout, so a committed one cannot redirect cargo or rustc
      # here (ADR-001; the architecture check also rejects such files).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      # Every PR closes its issue ("Closes #N") or states why none applies
      # ("No-Issue: <reason>"). The body goes through an env var, never
      # interpolated into the script (untrusted input).
      - name: PR links an issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # A whole closing keyword ("unresolved #12" and "prefix #3" do not
          # count), an optional colon, then #N or owner/repo#N.
          if grep -qiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+' <<<"$PR_BODY"; then
            echo "OK: PR closes an issue"
          elif grep -qE '^No-Issue:[[:space:]]*[^[:space:]]' <<<"$PR_BODY"; then
            echo "OK: explicit No-Issue exception"
          else
            echo "FAIL: PR body needs 'Closes #N' or a 'No-Issue: <reason>' line"
            exit 1
          fi
      # Nothing in the repository runs Python (ADR-015, D10): no tracked
      # file names the interpreter, which catches shebangs and absolute
      # paths that the PATH stubs below cannot see. ADR history and the
      # vendored toml-test corpus are the allowed hits. Git only; `-a`
      # reads every file as text, so no `.gitattributes` line of the PR can
      # hide one as binary.
      - name: No Python in tracked files
        run: |
          if git grep -n -a -E '\bpython3?\b' -- ':!docs/adr' ':!crates/boneli-toml/tests/toml-test'; then
            echo "a tracked file names the interpreter (ADR-015, D10)"
            exit 1
          fi
      # The entry point runs the checker from target/arch-check, so build
      # output must never come from the checkout (ADR-015, D2). Git only.
      - name: No build output in the checkout
        run: test -z "$(git ls-files -- target)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The core crates must build for a target without std (ADR-001);
          # boneli-sys is checked for both musl targets (ADR-007, D5).
          targets: x86_64-unknown-none, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      # Nothing in the repository runs Python (ADR-015, D10). Every Python
      # executable on PATH is shadowed by a stub of the same name that logs
      # its arguments and exits 127, for every later step of this job; the
      # last step fails if anything called one, even if a script swallowed
      # the error. The `[p]` keeps this file free of hits of the grep step
      # above.
      - name: Hide Python
        run: |
          stubs="$RUNNER_TEMP/no-py"
          mkdir -p "$stubs"
          IFS=:
          for dir in $PATH; do
            for exe in "$dir"/[p]ython*; do
              name=${exe##*/}
              if [ -f "$exe" ] && [ -x "$exe" ] && [ ! -e "$stubs/$name" ]; then
                printf '#!/bin/sh\nprintf "%%s %%s\\n" "%s" "$*" >> "%s/calls.log"\nexit 127\n' "$name" "$stubs" > "$stubs/$name"
                chmod +x "$stubs/$name"
              fi
            done
          done
          unset IFS
          ls "$stubs"
          echo "$stubs" >> "$GITHUB_PATH"
      # The gate is the first step that runs cargo in this job: before it
      # only git, rustup and the version queries of the toolchain action
      # have run, and RUSTUP_TOOLCHAIN outranks a committed toolchain file.
      # rust-cache and cargo fmt read the checkout's cargo config (an alias
      # can replace `cargo fmt`), so they come after it. The entry point
      # runs every cargo call from `/` and refuses to build the checker when
      # the build could run code from the checkout; the checker reports a
      # committed cargo config before its own cargo calls read it. The
      # checkout must be unchanged afterwards, untracked files included
      # (ADR-015, D2).
      - name: Architecture rules
        run: |
          ./tools/check-architecture.sh
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "the architecture check changed the checkout:"
            echo "$dirty"
            exit 1
          fi
      # Every rule has fail cases; a weakened rule turns this step red.
      - name: Architecture rule fixtures
        run: ./tools/check-architecture.sh --fixtures
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # X25519MLKEM768 against an independent implementation (ADR-016,
      # item 10): the only test that checks the reading of RFC 10024. It
      # fails, never skips, without OpenSSL 3.5 or the group; the grep
      # makes sure the 32-handshake test ran and passed, so a renamed or
      # filtered-out test cannot turn the step green.
      - name: boneli-https interop with OpenSSL (ADR-016)
        run: |
          openssl version
          out="$RUNNER_TEMP/interop.out"
          code=0
          cargo test -p boneli-https --test interop -- --ignored > "$out" 2>&1 || code=$?
          cat "$out"
          test "$code" = 0
          grep -q '^test openssl_hybrid_only_server_32_handshakes \.\.\. ok$' "$out"
          grep -q '^test openssl_x25519_only_server_falls_back \.\.\. ok$' "$out"
      # The shim (#9) ships as a static musl binary, and libc's constants
      # differ per target; aarch64 is otherwise only compiled on the arm
      # leg of `sandbox` (ADR-007, D5).
      - name: boneli-sys on musl
        run: |
          cargo check -p boneli-sys --all-targets --target x86_64-unknown-linux-musl
          cargo check -p boneli-sys --all-targets --target aarch64-unknown-linux-musl
      # The entry point builds the checker from `/`, so a cargo config
      # committed in the checkout cannot wrap the compiler of the gate
      # itself; the check still reports the file (ADR-015, D2). The wrapper
      # logs every compiler call it sees: the checker's own cargo calls go
      # through it, its build must not.
      - name: Architecture check builds outside committed cargo config
        run: |
          log="$RUNNER_TEMP/rustc-wrapper.log"
          wrapper="$RUNNER_TEMP/rustc-wrapper.sh"
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" >> "%s"\nexec "$@"\n' "$log" > "$wrapper"
          chmod +x "$wrapper"
          mkdir .cargo
          printf '[build]\nrustc-wrapper = "%s"\n' "$wrapper" > .cargo/config.toml
          touch crates/boneli-arch-check/src/lib.rs
          code=0
          ./tools/check-architecture.sh > "$RUNNER_TEMP/arch.out" || code=$?
          rm -r .cargo
          cat "$RUNNER_TEMP/arch.out"
          test "$code" = 1
          grep -q '^FAIL \[cargo-config\] \.cargo/config\.toml: ' "$RUNNER_TEMP/arch.out"
          test -s "$log"
          if grep -q -- '--crate-name boneli_arch_check' "$log"; then
            echo "the checker was built through the committed rustc-wrapper"
            exit 1
          fi
      # Regression attacks on the entry point (ADR-015, D2), each on a
      # fresh export of HEAD: a build script that deletes itself and a
      # foreign crate in the checker's build closure stop the check before
      # anything is built, a stale binary never runs, also with
      # CARGO_BUILD_TARGET set, and a checker crate taken out of the
      # workspace (also with its manifest path planted in a metadata table)
      # or reached through a symlink is refused before its build script can
      # run. Last, the
      # gate must be the first step of this job that runs cargo or
      # rust-cache.
      - name: Architecture check refuses code that runs before it
        run: |
          a="$RUNNER_TEMP/attack"
          out="$RUNNER_TEMP/attack.out"
          fresh() {
            rm -rf "$a"
            mkdir "$a"
            git archive HEAD | tar -x -C "$a"
          }
          gate() {
            code=0
            "$a/tools/check-architecture.sh" > "$out" || code=$?
            cat "$out"
          }
          # 1. A build script in a checker crate that would delete itself.
          fresh
          printf 'fn main() {\n    let _ = std::fs::remove_file(concat!(env!("CARGO_MANIFEST_DIR"), "/build.rs"));\n}\n' \
            > "$a/crates/boneli-toml/build.rs"
          gate
          test "$code" = 1
          grep -q '^FAIL \[build-script\] Cargo.toml: ' "$out"
          test -f "$a/crates/boneli-toml/build.rs"
          test ! -e "$a/target/arch-check"
          # 2. A member crate the checker's build would compile.
          fresh
          mkdir -p "$a/crates/boneli-extra/src"
          printf '[package]\nname = "boneli-extra"\nversion = "0.0.0"\nedition = "2024"\n' > "$a/crates/boneli-extra/Cargo.toml"
          : > "$a/crates/boneli-extra/src/lib.rs"
          printf '\n[dependencies]\nboneli-extra = { path = "../boneli-extra" }\n' >> "$a/crates/boneli-toml/Cargo.toml"
          (cd "$a" && cargo update --workspace --offline --quiet)
          gate
          test "$code" = 2
          grep -q "^FAIL \[tool-error\] Cargo.toml: the architecture checker's build would compile a crate other than" "$out"
          test ! -e "$a/target/arch-check"
          # 3. A stale binary where the fresh one goes, with build.target set.
          # The fresh binary is a hard link into deps/, so it is replaced,
          # not written through.
          fresh
          gate
          test "$code" = 0
          host=$(rustc -vV | sed -n 's/^host: //p')
          for stale in "$a/target/arch-check/$host/debug/boneli-arch-check" "$a/target/arch-check/debug/boneli-arch-check"; do
            mkdir -p "${stale%/*}"
            rm -f "$stale"
            printf '#!/bin/sh\necho "OK: STALE"\n' > "$stale"
            chmod +x "$stale"
          done
          code=0
          CARGO_BUILD_TARGET=$host "$a/tools/check-architecture.sh" > "$out" || code=$?
          cat "$out"
          test "$code" = 0
          if grep -q STALE "$out"; then
            echo "a stale checker binary ran"
            exit 1
          fi
          # 4. A checker crate excluded from the workspace, with a build
          # script that would leave a marker.
          fresh
          sed -i 's|^members = \["crates/\*"\]$|&\nexclude = ["crates/boneli-toml"]|' "$a/Cargo.toml"
          grep -q '^exclude = \["crates/boneli-toml"\]$' "$a/Cargo.toml"
          printf '[package]\nname = "boneli-toml"\nversion = "0.0.0"\nedition = "2024"\n' > "$a/crates/boneli-toml/Cargo.toml"
          printf 'fn main() {\n    let _ = std::fs::write(concat!(env!("CARGO_MANIFEST_DIR"), "/../../BUILD_SCRIPT_RAN"), "");\n}\n' \
            > "$a/crates/boneli-toml/build.rs"
          (cd "$a" && cargo metadata --offline --format-version 1 > /dev/null)
          gate
          test "$code" = 2
          grep -q '^FAIL \[tool-error\] Cargo.toml: boneli-toml, which the architecture checker.s build compiles, is not a member of this workspace$' "$out"
          test ! -e "$a/BUILD_SCRIPT_RAN"
          test ! -e "$a/target/arch-check"
          # 5. A checker crate whose directory is a symlink.
          fresh
          mv "$a/crates/boneli-json" "$a/elsewhere-json"
          ln -s ../elsewhere-json "$a/crates/boneli-json"
          gate
          test "$code" = 2
          grep -q '^FAIL \[tool-error\] Cargo.toml: crates/boneli-json is not a directory of this checkout without symlinks$' "$out"
          test ! -e "$a/target/arch-check"
          # 6. The excluded crate of 4, with its manifest path written into
          # [workspace.metadata], then into a member's [package.metadata]:
          # cargo metadata echoes both verbatim.
          for table in workspace package; do
            fresh
            sed -i 's|^members = \["crates/\*"\]$|&\nexclude = ["crates/boneli-toml"]|' "$a/Cargo.toml"
            printf '[package]\nname = "boneli-toml"\nversion = "0.0.0"\nedition = "2024"\n' > "$a/crates/boneli-toml/Cargo.toml"
            printf 'fn main() {\n    let _ = std::fs::write(concat!(env!("CARGO_MANIFEST_DIR"), "/../../BUILD_SCRIPT_RAN"), "");\n}\n' \
              > "$a/crates/boneli-toml/build.rs"
            if [ "$table" = workspace ]; then
              where="$a/Cargo.toml"
            else
              where="$a/crates/boneli-json/Cargo.toml"
            fi
            printf '\n[%s.metadata]\nmanifest_path = "%s"\n' "$table" "$a/crates/boneli-toml/Cargo.toml" >> "$where"
            (cd "$a" && cargo metadata --offline --format-version 1 > /dev/null)
            gate
            test "$code" = 2
            grep -q '^FAIL \[tool-error\] Cargo.toml: boneli-toml, which the architecture checker.s build compiles, is not a member of this workspace$' "$out"
            test ! -e "$a/BUILD_SCRIPT_RAN"
            test ! -e "$a/target/arch-check"
          done
          # 7. Nothing before the gate runs cargo or rust-cache.
          before=$(awk '/^  check:$/ { j = 1; next } j && /^  [^ ]/ { exit } j && /- name: Architecture rules$/ { exit } j' .github/workflows/ci.yml | grep -v '^ *#' || true)
          if printf '%s\n' "$before" | grep -n -E 'cargo|rust-cache'; then
            echo "a step before the gate runs cargo or rust-cache"
            exit 1
          fi
      - name: No Python was called
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/no-py/calls.log" ]; then
            echo "Python was called:"
            cat "$RUNNER_TEMP/no-py/calls.log"
            exit 1
          fi
          echo "OK: no step called Python"

  # The boneli-sys and boneli-oci host tests create user namespaces, so
  # they need a prepared host (ADR-007, D5; ADR-009). The job proves what
  # a stock runner lacks, prepares the runner with the host-setup block
  # from CLAUDE.md (the same block users run; this workflow has no
  # privileged step of its own) and runs every host test. Matrix values
  # are literals; no step interpolates untrusted input. The job names are
  # load-bearing (required checks).
  sandbox:
    name: sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # The probe ids a stock runner lacks (BONELI_SYS_EXPECT_MISSING).
            expect-missing: userns-apparmor,cgroup-not-delegated
            # Seccomp rows this kernel cannot observe (BONELI_SYS_HOST_GAPS).
            host-gaps: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            expect-missing: userns-apparmor,cgroup-not-delegated
            host-gaps: ""
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Nothing in the repository runs Python (ADR-015, D10). Every Python
      # executable on PATH is shadowed by a stub of the same name that logs
      # its arguments and exits 127, for every later step of this job; the
      # last step fails if anything called one, even if a script swallowed
      # the error. Third-party actions run before. The `[p]` keeps this
      # file free of hits of the acceptance grep in ADR-015 D10.
      - name: Hide Python
        run: |
          stubs="$RUNNER_TEMP/no-py"
          mkdir -p "$stubs"
          IFS=:
          for dir in $PATH; do
            for exe in "$dir"/[p]ython*; do
              name=${exe##*/}
              if [ -f "$exe" ] && [ -x "$exe" ] && [ ! -e "$stubs/$name" ]; then
                printf '#!/bin/sh\nprintf "%%s %%s\\n" "%s" "$*" >> "%s/calls.log"\nexit 127\n' "$name" "$stubs" > "$stubs/$name"
                chmod +x "$stubs/$name"
              fi
            done
          done
          unset IFS
          ls "$stubs"
          echo "$stubs" >> "$GITHUB_PATH"
      - name: Host features
        run: |
          uname -srm
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          for k in kernel/apparmor_restrict_unprivileged_userns user/max_user_namespaces \
                   kernel/unprivileged_userns_clone kernel/perf_event_paranoid dev/tty/legacy_tiocsti \
                   kernel/dmesg_restrict kernel/kptr_restrict kernel/yama/ptrace_scope \
                   kernel/io_uring_disabled kernel/unprivileged_bpf_disabled kernel/cap_last_cap; do
            echo "$k = $(cat "/proc/sys/$k" 2>/dev/null || echo absent)"
          done
          cg=$(sed -n 's/^0:://p' /proc/self/cgroup)
          echo "cgroup: $cg"
          stat -c 'cgroup owner: %U (%u)' "/sys/fs/cgroup$cg"
          echo "controllers: $(cat "/sys/fs/cgroup$cg/cgroup.controllers")"
          echo "cgroup2 mount: $(awk '$5 == "/sys/fs/cgroup" { for (i = 7; $i != "-"; i++); print $(i + 1), $(i + 3) }' /proc/self/mountinfo)"
          echo "user: $(id)"
          # The io write path (#52): which dd the image ships, what the
          # sandbox's writes go through (whether the hold check of
          # destroy_lifts_io_throttle may read the writer's /proc files is
          # the kernel/yama/ptrace_scope line above).
          echo "dd: $(command -v dd || echo absent): $(dd --version 2>/dev/null | head -n1 || true)"
          echo "thp: $(cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || echo absent)"
          for k in dirty_ratio dirty_background_ratio dirty_bytes dirty_background_bytes; do
            echo "vm.$k = $(cat "/proc/sys/vm/$k" 2>/dev/null || echo absent)"
          done
          echo "workspace fs: $(findmnt -no MAJ:MIN,SOURCE,FSTYPE,OPTIONS -T "$GITHUB_WORKSPACE" 2>/dev/null || echo absent)"
          dev=$(findmnt -no MAJ:MIN -T "$GITHUB_WORKSPACE" 2>/dev/null | head -n1 | tr -d ' ' || true)
          q=""
          if [ -n "$dev" ] && [ -d "/sys/dev/block/$dev" ]; then
            q="/sys/dev/block/$dev/queue"
            [ -d "$q" ] || q="/sys/dev/block/$dev/../queue"
          fi
          for f in logical_block_size max_sectors_kb max_hw_sectors_kb dma_alignment rotational scheduler; do
            echo "queue $f: $( [ -n "$q" ] && cat "$q/$f" 2>/dev/null || echo absent)"
          done
          lsblk -o NAME,MAJ:MIN,TYPE,FSTYPE,SIZE,MOUNTPOINTS || true
      # The X25519MLKEM768 known-answer tests on aarch64 (ADR-016, item
      # 10): keccak picks a backend with the SHA3 instructions at run time
      # there, and no other job runs boneli-https code on arm64. The grep
      # makes sure the layout tests ran and passed.
      - name: boneli-https KAT on arm64
        if: matrix.arch == 'arm64'
        run: |
          grep -m1 -ow sha3 /proc/cpuinfo || echo "no sha3 extension: keccak's soft backend"
          out="$RUNNER_TEMP/kat.out"
          code=0
          cargo test -p boneli-https --lib pq:: > "$out" 2>&1 || code=$?
          cat "$out"
          test "$code" = 0
          for t in kat_client_share_is_ek_then_x25519 kat_secret_is_mlkem_then_x25519 \
                   kat_with_ring_x25519_halves_in_place implicit_rejection_is_not_an_error; do
            grep -q "^test pq::tests::$t \.\.\. ok$" "$out"
          done
      # Both crates' test binaries in one build, before the host is
      # prepared: the AppArmor profile names their paths (ADR-009).
      - name: Build
        run: cargo test -p boneli-sys -p boneli-oci --no-run
      # The error a user gets on an unprepared host, asserted exactly.
      - name: Unprepared runner
        env:
          BONELI_SYS_EXPECT_MISSING: ${{ matrix.expect-missing }}
        run: cargo test -p boneli-sys --test boneli_sys_tests -- --ignored --exact probe::reports_expected_missing
      - name: Prepare the runner host
        run: |
          awk '/^<!-- host-setup:begin -->$/ { m = 1; next }
               /^<!-- host-setup:end -->$/ { m = 0 }
               m && /^```$/ { c = 0 }
               m && c { print }
               m && /^```sh$/ { c = 1 }' CLAUDE.md > "$RUNNER_TEMP/host-setup.sh"
          if [ ! -s "$RUNNER_TEMP/host-setup.sh" ]; then
            echo "the host-setup block in CLAUDE.md is empty or missing"
            exit 1
          fi
          cat "$RUNNER_TEMP/host-setup.sh"
          start=$(date +%s)
          TARGET_DIR="$GITHUB_WORKSPACE/target" RUN_USER="$USER" ENABLE_LINGER=1 sh -eu "$RUNNER_TEMP/host-setup.sh"
          echo "host-setup took $(( $(date +%s) - start )) s"
      - name: Host tests
        env:
          BONELI_SYS_HOST_GAPS: ${{ matrix.host-gaps }}
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --scope -q -p Delegate=yes \
            env BONELI_SYS_TEST_CGROUP=self BONELI_SYS_HOST_GAPS="$BONELI_SYS_HOST_GAPS" \
            cargo test -p boneli-sys -- --ignored
      # boneli-oci's host tests (#7, ADR-009): a pulled synthetic image in
      # the sandbox, the casefold and ramfs store roots. No network; the
      # Docker Hub pulls run in oci-acceptance.yml.
      - name: boneli-oci host tests
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --scope -q -p Delegate=yes \
            env BONELI_SYS_TEST_CGROUP=self \
            cargo test -p boneli-oci --test boneli_oci_tests -- --ignored host::
      - name: No Python was called
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/no-py/calls.log" ]; then
            echo "Python was called:"
            cat "$RUNNER_TEMP/no-py/calls.log"
            exit 1
          fi
          echo "OK: no step called Python"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # cargo-deny runs cargo metadata: same pin as in `check` (ADR-001).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary instead of compiling cargo-deny from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
