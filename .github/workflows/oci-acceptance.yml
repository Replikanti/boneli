name: oci-acceptance

# The acceptance of ADR-009 (#7): pull node:22 and postgres:17, pinned by
# index digest, from Docker Hub on both architectures and run both in the
# sandbox. And of ADR-029 (#57): pull signed images under a `Required`
# signature rule (chainguard/node on Docker Hub and cgr.dev, cosign on
# GHCR, pause through Artifact Registry) and refuse the unsigned node:22
# before any layer request. And of ADR-031 (#104): pull jq 1.8.2 from GHCR
# under a `Required` rule with SLSA provenance claims, and refuse it under
# another source repository before any layer is committed
# (`provenance_claims_on_ghcr`, 14 GHCR manifest, tag and referrers
# requests per architecture per run: 5 for the pull that passes, 9 for
# the one refused, 2 of them the `.att` tags ADR-036 adds under claims
# when the referrers find nothing; counted from the test's code path).
# And of ADR-034 (#113): pull jq 1.8.2 under Fulcio certificate claims
# with the statement agreement, and refuse it under another build trigger
# (`certificate_claims_on_ghcr`, 14 more GHCR requests per architecture
# per run, the same 5 and 9: the rule has provenance claims too, so the
# code path is `provenance_claims_on_ghcr`'s). And of ADR-036 (#114):
# pull flux-cli v2.4.0 from GHCR under a rule with SLSA v0.2 claims, its
# cosign `.att` from slsa-github-generator, and refuse it under another
# source repository (`provenance_v02_on_ghcr`, 13 GHCR manifest, tag and
# referrers requests per architecture per run: 5 for the pull that
# passes, 8 for the one refused). And of ADR-032
# (#105): node:22 and postgres:17 pull as references the agent chose under
# the documented exemption docker.io + library/, and the agent's node:22
# with no exemption is refused with no connection, so the Docker Hub
# request count below is unchanged. And of ADR-033 (#103): refresh
# trusted_root.json from tuf-repo-cdn.sigstore.dev through TUF, from the
# pinned Sigstore root v16, into an empty trust directory and once more
# (`sigstore_refresh_live`, 9 requests per architecture per run: 5 for
# the first refresh, 4 for the second, which finds the file current); weekly
# because the timestamp expires 7 days after it is signed and upstream
# drift (a new key type, the target moved into a delegation) must show up
# within that week. Weekly, because
# registry changes (a garbage-collected digest, a CDN host move, the token
# flow, a signature replaced) show up within 7 days at 15 Docker Hub
# manifest, tag and referrers requests per architecture per run (4 before
# ADR-029, 2 for the pull of node:22 through Squid of ADR-039, counted
# from the tests' code paths), far below the measured
# anonymous limit of 100 per hour. A blob redirect to a host outside the
# allowlist fails the pull and names the host: this is where a new Docker
# Hub redirect target shows up first (ADR-035, #117). Never on code paths
# and not a required check, so a Docker Hub outage cannot block a code PR.
# `pull_request` is limited to this file: GitHub dispatches
# `workflow_dispatch` only for workflows already on the default branch, so
# the PR that adds or edits this file runs it before merge.
on:
  schedule:
    # Mondays 05:17 UTC, off the hour to spread scheduler load.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/oci-acceptance.yml

concurrency:
  group: oci-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # As in ci.yml: the installed toolchain outranks any toolchain file
      # in the checkout (ADR-001).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test -p boneli-oci --test boneli_oci_tests --no-run
      # The same host preparation as the sandbox job of ci.yml: the
      # host-setup block from CLAUDE.md, extracted between its markers.
      - name: Prepare the runner host
        run: |
          awk '/^<!-- host-setup:begin -->$/ { m = 1; next }
               /^<!-- host-setup:end -->$/ { m = 0 }
               m && /^```$/ { c = 0 }
               m && c { print }
               m && /^```sh$/ { c = 1 }' CLAUDE.md > "$RUNNER_TEMP/host-setup.sh"
          if [ ! -s "$RUNNER_TEMP/host-setup.sh" ]; then
            echo "the host-setup block in CLAUDE.md is empty or missing"
            exit 1
          fi
          TARGET_DIR="$GITHUB_WORKSPACE/target" RUN_USER="$USER" ENABLE_LINGER=1 sh -eu "$RUNNER_TEMP/host-setup.sh"
      # Pull time, throughput, the longest gap between reads and the layer
      # media types are printed per image (ADR-009, D5 and D12).
      - name: Pull and run node:22 and postgres:17, check image signatures
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --scope -q -p Delegate=yes \
            env BONELI_SYS_TEST_CGROUP=self \
            cargo test -p boneli-oci --test boneli_oci_tests -- --ignored network:: --nocapture
      # ADR-033: the TUF refresh of Sigstore's trusted root, also when a
      # pull above failed; versions, run time and the target's SHA-256 are
      # printed. It needs no host preparation.
      - name: Refresh Sigstore's trusted root through TUF
        if: ${{ !cancelled() }}
        run: cargo test -p boneli-tuf --test network -- --ignored --nocapture
      # ADR-039 (#55): node:22 through Squid, with direct outbound 80 and
      # 443 rejected for this user (Squid runs as `proxy`), so every
      # registry connection and every CRL or OCSP fetch of the pull has to
      # go through the proxy. Squid's answer heads to an accepted and a
      # refused CONNECT are printed for ADR-039 D9 (bytes, fields), and its
      # access log, counted only from the lines the pull wrote, must show a
      # CONNECT to Docker Hub's API host and an absolute-form GET of a
      # revocation fetch. The probes use auth.docker.io, so none of their
      # lines can stand in for the pull's. Last, because the rules would
      # block the steps after it; they are removed when the step ends
      # either way.
      - name: Pull node:22 through Squid with direct egress blocked
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q squid
          i=0
          until (exec 3<>/dev/tcp/127.0.0.1/3128) 2>/dev/null; do
            i=$((i + 1)); [ "$i" -le 30 ] || { echo "squid: not listening after 30 s"; exit 1; }; sleep 1
          done
          squid -v | sed -n 1p
          # The answer head to one CONNECT: its bytes up to and including
          # the empty line, and its field lines.
          connect_head() {
            exec 3<>/dev/tcp/127.0.0.1/3128
            printf 'CONNECT %s HTTP/1.1\r\nHost: %s\r\n\r\n' "$1" "$1" >&3
            timeout 10 cat <&3 > "$RUNNER_TEMP/head-$2" || true
            exec 3<&- 3>&-
            LC_ALL=C awk -v what="$2" -v target="$1" '
              BEGIN { RS = "\r\n" }
              NR == 1 { status = $0; bytes = length($0) + 2; next }
              $0 == "" { bytes += 2; done = 1; exit }
              { bytes += length($0) + 2; fields++ }
              END { printf "squid CONNECT head (%s, %s): %s; %d bytes, %d fields, complete=%d\n", what, target, status, bytes, fields, done }
            ' "$RUNNER_TEMP/head-$2"
          }
          connect_head auth.docker.io:443 accepted
          connect_head auth.docker.io:25 refused
          me=$(id -u)
          cleanup() {
            for t in iptables ip6tables; do
              sudo "$t" -D OUTPUT -p tcp -m owner --uid-owner "$me" -m multiport --dports 80,443 -j REJECT || true
            done
          }
          trap cleanup EXIT
          for t in iptables ip6tables; do
            sudo "$t" -I OUTPUT -p tcp -m owner --uid-owner "$me" -m multiport --dports 80,443 -j REJECT
          done
          if curl -sS -o /dev/null --max-time 10 https://registry-1.docker.io/v2/; then
            echo "direct HTTPS still works; the block is not in place"
            exit 1
          fi
          curl -sS -o /dev/null --max-time 20 -x http://127.0.0.1:3128 https://auth.docker.io/token \
            -w 'through squid: %{http_code}\n'
          # Only the lines written from here on belong to the pull.
          before=$(sudo sh -c 'wc -l < /var/log/squid/access.log')
          BONELI_OCI_TEST_PROXY=127.0.0.1:3128 \
            cargo test -p boneli-oci --test boneli_oci_tests -- --ignored proxy:: --nocapture
          sudo tail -n "+$((before + 1))" /var/log/squid/access.log > "$RUNNER_TEMP/pull.log"
          echo "squid log lines of the pull: $(wc -l < "$RUNNER_TEMP/pull.log")"
          grep -c ' CONNECT registry-1.docker.io:443 ' "$RUNNER_TEMP/pull.log"
          grep ' GET http://' "$RUNNER_TEMP/pull.log"
