[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Replikanti/boneli"
publish = false

# Unsafe code lives only in boneli-sys, which opts out of these lints
# explicitly (docs/ARCHITECTURE.md, "Pure Rust and dependencies").
# tools/check-architecture.sh asserts that unsafe_code stays "forbid" and
# that every other crate inherits this table unchanged (ADR-001).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Dependencies: every edge into an external crate needs a record in
# tools/architecture.toml (ADR-001), and the crate is justified in a comment
# where it is added.
[workspace.dependencies]
boneli-domain = { path = "crates/boneli-domain" }
boneli-app = { path = "crates/boneli-app" }
boneli-http = { path = "crates/boneli-http" }
boneli-memory = { path = "crates/boneli-memory" }
